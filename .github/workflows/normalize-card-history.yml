name: Publish HScard API
on:
  push:
    paths:
      - '.github/workflows/normalize-card-history.yml'
      - 'cards.json'
      - 'cards-date.json'
      - 'render*.json'
      - 'history*.json'
      - 'release-policy.json'
      - 'data/**'
      - 'metadata/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate date-first migration and generate both API transports
        run: |
          python3 tools/migrate-date-schema.py
          python3 tools/build-api.py
          python3 tools/test-naxx-history.py
          python3 tools/test-naxx-first-release.py
          python3 tools/test-date-schema.py
          python3 tools/test-naxx-mechanics.py
          python3 tools/test-legacy-compatibility.py
          python3 tools/test-build-idempotence.py
          git diff --check
      - name: Commit changed API indexes and validation reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cards.json data metadata tools/*validation.json tools/legacy-compatibility-losses.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish card API indexes [skip ci]"
            git push
          fi
